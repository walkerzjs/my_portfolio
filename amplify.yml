version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:

            - yarn install --frozen-lockfile
        build:
          commands:
            # Add this command for each private environment variable
            - echo "RECAPTCHA_SECRET_KEY=$RECAPTCHA_SECRET_KEY" >> .env.production
            # Repeat for other variables:
            # - echo "ANOTHER_VAR=$ANOTHER_VAR" >> .env.production
            
            - yarn run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*